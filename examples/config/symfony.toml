[server]
host = "127.0.0.1"
port = 19885

[files]
pid_file = "/tmp/vhttpd_symfony.pid"
event_log = "/tmp/vhttpd_symfony.events.ndjson"

[worker]
autostart = true
read_timeout_ms = 3000
socket = "/tmp/vslim_symfony.sock"
cmd = "php -d extension=${env.VSLIM_EXT:-} ./php/package/bin/php-worker"

[worker.env]
VHTTPD_APP = "./examples/symfony/app.php"

[admin]
host = "127.0.0.1"
port = 19985
token = ""
