[server]
host = "127.0.0.1"
port = 19881

[files]
pid_file = "/tmp/vhttpd_hello.pid"
event_log = "/tmp/vhttpd_hello.events.ndjson"

[worker]
autostart = true
read_timeout_ms = 3000
socket = "/tmp/vslim_hello.sock"
cmd = "php -d extension=${env.VSLIM_EXT:-} ./php/package/bin/php-worker"

[worker.env]
VHTTPD_APP = "./examples/hello-app.php"

[admin]
host = "127.0.0.1"
port = 19981
token = ""
