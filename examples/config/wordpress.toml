[server]
host = "127.0.0.1"
port = 19887

[files]
pid_file = "/tmp/vhttpd_wordpress.pid"
event_log = "/tmp/vhttpd_wordpress.events.ndjson"

[worker]
autostart = true
read_timeout_ms = 3000
socket = "/tmp/vphp_wordpress.sock"
cmd = "php ./examples/wordpress/vendor/bin/vphp-worker"

[worker.env]
VHTTPD_APP = "./examples/wordpress/app.php"
VPHP_WP_ROOT = "/ABS/PATH/TO/WORDPRESS"

[admin]
host = "127.0.0.1"
port = 19987
token = ""
