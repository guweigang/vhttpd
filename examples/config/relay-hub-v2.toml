version = 2

[server]
timezone = "Asia/Shanghai"
pid_file = "/tmp/vhttpd_relay_hub_v2.pid"

[observability]
event_log = "/tmp/vhttpd_relay_hub_v2.events.ndjson"

[listeners.relay]
protocol = "websocket"
transport = "tcp"
host = "127.0.0.1"
port = 19921

[relays.edge]
mode = "hub"
carrier = "websocket"
listener = "listener:relay"
path = "/vhttpd/relay"
node_id = "hub-local"
token = "change-me"
max_channels = 1024
channel_buffer = 64
