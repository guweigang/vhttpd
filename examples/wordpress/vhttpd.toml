# vhttpd configuration for WordPress demo
#
# 从 vhttpd 仓库根目录启动：
# VPHP_WP_ROOT=/Users/guweigang/wwwroot/wordpress ./vhttpd --config examples/wordpress/vhttpd.toml

[server]
host = "127.0.0.1"
port = 19881

[executor]
kind = "php"

[worker]
autostart = true
pool_size = 4
socket = "/tmp/vhttpd_wordpress.sock"

# 推荐注入 VPHP_WP_ROOT 环境变量 (也可以通过系统环境变量传递)
[worker.env]
VPHP_WP_ROOT = "${env.VPHP_WP_ROOT}"

[php]
# WordPress 通过 vphp-worker 运行，不依赖 vslim 扩展。
worker_entry = "./vendor/bin/vphp-worker"
app_entry = "./app.php"

# WordPress 作为根站点运行时不要把源码根目录挂到 prefix="/"；
# 否则 wp-admin/*.php 可能被静态层直接暴露。静态资源由 app.php 内部安全处理。
[assets]
enabled = false
prefix = "/assets"
root = "${env.VPHP_WP_ROOT}"
cache_control = "public, max-age=31536000"
