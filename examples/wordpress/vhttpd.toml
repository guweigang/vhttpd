[server]
host = "127.0.0.1"
port = 8080
index = "index.php"   # <--- 在这里自定义默认文档 (默认为 index.php)

[site]
name = "wordpress"
root = "/Users/guweigang/wwwroot/wordpress"
index = "index.php"
default_executor = "php"

[db]
enabled = true
socket = "/tmp/vhttpd_wp_db.sock"
driver = "mysql"
pool_name = "wordpress"

[db.mysql]
host = "127.0.0.1"
port = 3306
username = "root"
password = "Abcd.1234"
database = "wordpress"
pool_size = 5
wordpress_compat = true

[cache]
enabled = true
socket = "/tmp/vhttpd_wp_cache.sock"

# 1. 默认执行器 (主池): 负责前台的高性能长驻运行
[executors.php]
kind = "php"
worker_entry = "./vendor/bin/vphp-worker"
app_entry = "./app.php"
deny_php = [
    "/wp-config.php",
    "/wp-config-sample.php",
    "/wp-load.php",
    "/wp-settings.php",
    "/wp-blog-header.php",
    "/wp-content/uploads/*",
    "/wp-includes/*",
    "/wp-admin/includes/*"
]
compat_php = [
    "/wp-admin/*",
    "/wp-login.php",
    "/wp-comments-post.php",
    "/wp-cron.php",
    "/xmlrpc.php",
    "/wp-trackback.php",
    "/wp-links-opml.php",
    "/wp-activate.php",
    "/wp-signup.php",
    "/wp-mail.php"
]

[executors.php.worker]
autostart = true
pool_size = 4
socket = "/tmp/vhttpd_wp_main.sock"
queue_capacity = 64
queue_timeout_ms = 10000

[executors.php.worker.env]
VPHP_WP_ROOT = "/Users/guweigang/wwwroot/wordpress"
VHTTPD_VENDOR = "/Users/guweigang/Source/vhttpd/php/package"
VHTTPD_DB_SOCKET = "/tmp/vhttpd_wp_db.sock"
VHTTPD_DB_POOL = "wordpress"
VHTTPD_DB_TIMEOUT_MS = "3000"
VHTTPD_CACHE_SOCKET = "/tmp/vhttpd_wp_cache.sock"

# 2. 附加执行器 (附加池): 负责后台管理、登录等不适合/不支持长驻模式的动态脚本
[executors.php-cgi]
kind = "php-cgi"
bin = "php-cgi"

[executors.php-cgi.worker]
autostart = true
pool_size = 2
socket = "/tmp/vhttpd_wp_cgi.sock"
queue_capacity = 64
queue_timeout_ms = 10000

[executors.php-cgi.worker.env]
VPHP_WP_ROOT = "/Users/guweigang/wwwroot/wordpress"
VHTTPD_VENDOR = "/Users/guweigang/Source/vhttpd/php/package"
VHTTPD_DB_SOCKET = "/tmp/vhttpd_wp_db.sock"
VHTTPD_DB_POOL = "wordpress"
VHTTPD_DB_TIMEOUT_MS = "3000"
VHTTPD_CACHE_SOCKET = "/tmp/vhttpd_wp_cache.sock"


# 3. 路由分流策略 (按顺序从上往下匹配，匹配成功即刻阻断)
# ==========================================================

# 规则 3.1: 阻断敏感配置文件的直接访问 (安全防范)
# ==========================================================
# 路由分流策略 (请把静态文件后缀拦截放在最顶部)
# ==========================================================

# 规则 3.1: 拦截全站任意目录下的静态文件后缀，由 static 极速直回
[[routes]]
match.path = [
    "*.css",
    "*.js",
    "*.png",
    "*.jpg",
    "*.jpeg",
    "*.gif",
    "*.svg",
    "*.ico",
    "*.woff",
    "*.woff2",
    "*.ttf"
]
executor = "static"
root = "${site.root}"

# 规则 3.2: 其他非特定后缀的静态资源目录直回
[[routes]]
match.path = [
    "/wp-content/*",
    "/wp-includes/*",
    "/favicon.ico",
    "robots.txt"
]
executor = "static"
root = "${site.root}"

# 规则 3.3: WordPress REST API 通过 /index.php?rest_route=... 进入，
# long-running worker 会把部分 REST 输出写到 stdout，因此这里走 CGI/compat 池
[[routes]]
match.path = ["/index.php"]
match.query = { rest_route = "*" }
executor = "php-cgi"

# Pretty permalink REST API: /wp-json/... behaves like
# /index.php?rest_route=/...
[[routes]]
match.path = ["/wp-json", "/wp-json/*"]
executor = "php-cgi"
rewrite = "/index.php?rest_route=$path_remainder"
rewrite_strip_prefix = "/wp-json"

# 规则 3.4: 兜底规则 (选填)
# 任何未匹配上述规则的动态请求，将默认派发给 [executor].kind 中定义的 "php" (php-worker) 高性能长驻主池处理
