# Standalone launcher. Desktop installs component.toml into its existing environment.
version = 2
include = ["component.toml"]

[server]
timezone = "Asia/Shanghai"
pid_file = "runtime.pid"

[observability]
event_log = "events.ndjson"

[listeners.codexbot_admin]
protocol = "http"
transport = "tcp"
host = "127.0.0.1"
port = 19983

[control]
listener = "listener:codexbot_admin"
token = "change-me"
