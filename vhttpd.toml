[server]
host = "127.0.0.1"
port = 8081

[runtime]
timezone = "Asia/Shanghai"

[worker]
autostart = true
pool_size = 4
# Use ${env.VSLIM_EXT} for the PHP extension path; it typically lives outside this repo.
cmd = "php -d extension=${env.VSLIM_EXT:-} ./php/package/bin/php-worker"

[worker.env]
VHTTPD_APP = "./examples/codexbot-app.php"

[feishu]
enabled = true

[feishu.main]
app_id = "${env.FEISHU_APP_ID:-}"
app_secret = "${env.FEISHU_APP_SECRET:-}"
verification_token = "${env.FEISHU_VERIFICATION_TOKEN:-}"
encrypt_key = "${env.FEISHU_ENCRYPT_KEY:-}"

[codex]
enabled = true
url = "${env.CODEX_URL:-ws://127.0.0.1:4500}"
approval_policy = "never"
sandbox = "workspaceWrite"
flush_interval_ms = 400
