version = 2

[server]
pid_file = "runtime.pid"

[observability]
event_log = "events.ndjson"

[listeners.web]
protocol = "http"
transport = "tcp"
host = "127.0.0.1"
port = 19882

[listeners.admin]
protocol = "http"
transport = "tcp"
host = "127.0.0.1"
port = 19982

[control]
listener = "listener:admin"
token = "local-development-only"

[engines.app]
kind = "vjsx"
entry = "main.mts"
runtime_profile = "node"
thread_count = 1

[adapters.app]
kind = "http-handler"
engine = "engine:app"

[[pipelines]]
id = "api"
ingress = "listener:web"
match.paths = ["*"]
egress = "adapter:app"
