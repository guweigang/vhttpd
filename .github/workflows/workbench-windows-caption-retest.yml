name: Windows Caption Repaint Acceptance
on:
  push:
    branches: ['codex/windows-workbench-build-ci']
    paths: ['.github/workflows/workbench-windows-caption-retest.yml']
permissions:
  contents: read
  actions: read
jobs:
  portable:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - uses: actions/download-artifact@v4
        with:
          name: workbench-windows-amd64-build-probe
          run-id: 40857516672
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/compiled-caption-fix
      - uses: actions/download-artifact@v4
        with:
          name: vhttpd-workbench-windows-amd64-test
          run-id: 40853163884
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified-runtime-bundle
      - name: Package the attested MSVC binary with verified runtime files
        id: package
        run: |
          $build = "$env:RUNNER_TEMP/compiled-caption-fix/windows-build"
          $previous = "$env:RUNNER_TEMP/verified-runtime-bundle"
          $attestation = Get-Content "$build/result.json" -Raw | ConvertFrom-Json
          if ($attestation.commit -ne 'aa8dfcad6482a5040748256f44172eb94328fa4f') { throw 'Unexpected binary source revision' }
          & "$previous/Verify-Package.ps1"
          # Only Win32 painting code changed. Keep the already verified runtime
          # DLLs, SSH clients and licenses; validate dependency closure again.
          $name = 'vhttpd-workbench-windows-amd64-test-' + $attestation.commit.Substring(0,12)
          $output = "$PWD/desktop/ci/results/windows-package"
          $stage = "$output/$name"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "$previous/*" $stage -Recurse
          Copy-Item "$build/vhttpd-workbench.exe" "$stage/vhttpd-workbench.exe" -Force
          Copy-Item "$build/vhttpd-ssh-askpass.exe" "$stage/vhttpd-ssh-askpass.exe" -Force
          $info = Get-Content "$stage/build-info.json" -Raw | ConvertFrom-Json
          $original = $info.commit
          $info.commit = $attestation.commit
          $info.run = $env:GITHUB_RUN_ID
          $info | Add-Member -NotePropertyName binary_build_run -NotePropertyValue '40857516672'
          $info | Add-Member -NotePropertyName runtime_bundle_commit -NotePropertyValue $original
          $info | ConvertTo-Json | Set-Content "$stage/build-info.json" -Encoding utf8
          $files = @(Get-ChildItem $stage -File -Recurse | Where-Object { $_.FullName -ne "$stage/files.json" -and $_.Name -ne 'files.json' } | ForEach-Object {
            @{path=[IO.Path]::GetRelativePath($stage,$_.FullName).Replace('\','/');sha256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()}
          } | Sort-Object { $_.path })
          ConvertTo-Json -InputObject $files | Set-Content "$stage/files.json" -Encoding utf8
          & "$stage/Verify-Package.ps1"
          $archive = "$stage.zip"
          Compress-Archive $stage $archive
          ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() + "  $name.zip") | Set-Content "$archive.sha256" -Encoding ascii
          "package_dir=$stage", "archive=$archive" | Add-Content $env:GITHUB_OUTPUT
      - name: Check pressed caption, release, form focus and Tab
        run: |
          $output = "$PWD/desktop/ci/results/caption-retest"
          New-Item -ItemType Directory -Force $output | Out-Null
          $env:VHTTPD_DESKTOP_DATA_DIR = "$output/data"
          $env:VHTTPD_DESKTOP_REGISTRY = "$output/data/projects.json"
          $env:VHTTPD_DESKTOP_CI_READY = "$output/ready.txt"
          $process = Start-Process '${{ steps.package.outputs.package_dir }}/vhttpd-workbench.exe' -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(30)
            while (!(Test-Path $env:VHTTPD_DESKTOP_CI_READY) -and !$process.HasExited -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 100; $process.Refresh() }
            if (!(Test-Path $env:VHTTPD_DESKTOP_CI_READY)) { throw 'Packaged window did not start' }
            Start-Sleep -Seconds 2
            ./desktop/ci/verify_windows_ui.ps1 -DesktopProcessId $process.Id -OutputDirectory $output
            if (!$process.CloseMainWindow() -or !$process.WaitForExit(15000) -or $process.ExitCode -ne 0) { throw 'Window did not close normally' }
          } finally { if (!$process.HasExited) { Stop-Process -Id $process.Id -Force } }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check paramiko==5.1.0
      - name: Verify extracted archive without development environment
        run: ./desktop/ci/verify_windows_package.ps1 -Archive '${{ steps.package.outputs.archive }}' -ResultDirectory "$PWD/desktop/ci/results/windows-portable"
      - uses: actions/upload-artifact@v4
        with:
          name: vhttpd-workbench-windows-amd64-test
          path: ${{ steps.package.outputs.package_dir }}/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: vhttpd-workbench-windows-amd64-test-archive
          path: |
            desktop/ci/results/windows-package/vhttpd-workbench-*.zip
            desktop/ci/results/windows-package/vhttpd-workbench-*.zip.sha256
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-caption-retest-diagnostics
          path: |
            desktop/ci/results/caption-retest/
            desktop/ci/results/windows-portable/
