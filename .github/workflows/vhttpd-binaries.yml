name: Focused inbound lifecycle diagnostic
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Exact acceptance source commit to verify'
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      VJOBS: 2
      VTEST_FAIL_FAST: '1'
      VTEST_FAIL_FLAKY: '1'
      VTEST_HIDE_OK: '0'
      VTEST_HIDE_SKIP: '0'
      V_MACOS_V3_NO_FALLBACK: '1'
      WITH_DB: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_ref }}
      - uses: ./.github/actions/setup-runtime
      - name: Compile the unchanged inbound lifecycle test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-results
          unset GITHUB_ACTIONS
          v -cc cc -d build_quickjs -path "$PWD/src|@vlib|@vmodules" -d use_openssl -enable-globals -nocache -d vjsx_sqlite -d enable_db -o "$PWD/ci-results/inbound_lifecycle_test" src/inbound_websocket_lifecycle_test.v 2>&1 | tee ci-results/inbound-build.log
      - name: Repeat real signals and bound orphan admission
        shell: bash
        run: |
          set -euo pipefail
          unset GITHUB_ACTIONS
          python3 - <<'PY'
          import json,os,signal,subprocess,tempfile,time
          from pathlib import Path
          out=Path('ci-results');binary=out.resolve()/'inbound_lifecycle_test';results=[]
          for i in range(20):
           start=time.monotonic();proc=subprocess.Popen([str(binary)],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,start_new_session=True)
           try:stdout,_=proc.communicate(timeout=30)
           except subprocess.TimeoutExpired:
            rows=[]
            for line in subprocess.check_output(['ps','-axo','pid=,ppid=,pgid=,etime=,comm='],text=True).splitlines():
             fields=line.split(None,4)
             if len(fields)==5 and int(fields[2])==proc.pid:rows.append(fields)
            (out/'blocked-process-group.json').write_text(json.dumps(rows,indent=2)+'\n')
            for row in rows:
             if row[-1]=='<defunct>':continue
             subprocess.run(['/usr/bin/sample',row[0],'3','-file',str(out/f'sample-{row[0]}.txt')],timeout=20,check=False)
            os.killpg(proc.pid,signal.SIGKILL);stdout,_=proc.communicate(timeout=10);(out/f'inbound-repeat-{i+1}.log').write_bytes(stdout);print('STALLED',i+1,stdout.decode(errors='replace'),flush=True);raise SystemExit(124)
           (out/f'inbound-repeat-{i+1}.log').write_bytes(stdout);elapsed=time.monotonic()-start;results.append({'iteration':i+1,'exit':proc.returncode,'seconds':elapsed});print('INBOUND',results[-1],flush=True)
           if proc.returncode:print(stdout.decode(errors='replace'),flush=True);raise SystemExit(proc.returncode)
          with tempfile.TemporaryDirectory(prefix='inbound-no-parent-') as root:
           start=time.monotonic();r=subprocess.run([str(binary),'--inbound-signal',root],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=10);elapsed=time.monotonic()-start;(out/'no-parent.log').write_bytes(r.stdout);assert r.returncode!=0 and elapsed<8 and Path(root,'address').read_text().strip();boundary={'exit':r.returncode,'seconds':elapsed};print('BOUNDED CHILD',boundary,flush=True)
          (out/'inbound-focused-result.json').write_text(json.dumps({'status':'passed','repeats':results,'no_parent':boundary},indent=2)+'\n');print('INBOUND20/20 AND BOUNDED CHILD PASSED',flush=True)
          PY
      - name: Preserve focused results and samples
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: inbound-lifecycle-focused-logs
          path: |
            ci-results/*.log
            ci-results/*.json
            ci-results/*.txt
          if-no-files-found: error
          retention-days: 14
