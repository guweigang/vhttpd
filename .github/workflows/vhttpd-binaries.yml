name: Build vhttpd binaries

on:
  workflow_dispatch:
    inputs:
      validation:
        description: 'PR gates or the same full matrix used by nightly'
        type: choice
        options: [pr, nightly]
        default: pr
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "dbsrc/**"
      - "php/**"
      - "tests/**"
      - "examples/**"
      - "assets/**"
      - "scripts/**"
      - "desktop/ci/**"
      - "Makefile"
      - "v.mod"
      - ".github/**"
  # Every PR, including test-only/PHP/CI changes, gets the same checks.
  pull_request:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.validation != 'nightly'
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    env:
      VJOBS: 2
      VTEST_FAIL_FAST: '1'
      VTEST_FAIL_FLAKY: '1'
      V_MACOS_V3_NO_FALLBACK: '1' # Applies to every OS; keep the pinned compiler.
      WITH_DB: 1
      VHTTPD_BIN: ${{ github.workspace }}/tmp/ci/vhttpd
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-amd64
          - os: macos-15-intel
            target: macos-amd64
          - os: macos-15
            target: macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: ./.github/actions/setup-runtime

      - name: Run fast unit tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-results tmp/ci
          make test-fast V_CC=cc 2>&1 | tee ci-results/fast.log

      - name: Build production binary
        shell: bash
        run: |
          set -euo pipefail
          make prod V_CC=cc VPHP_V_GC=boehm WITH_DB=1 2>&1 | tee ci-results/prod.log

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          VHTTPD_E2E_KEEP_TMP=1 make test-e2e 2>&1 | tee ci-results/e2e.log
          "$VHTTPD_BIN" --help >/dev/null
          if "$VHTTPD_BIN" -1 >/dev/null 2>&1; then
            echo "expected unknown option to fail"
            exit 1
          fi

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          bundle="vhttpd-${{ matrix.target }}"
          mkdir -p "$bundle/scripts" "$bundle/runtime"
          cp "$VHTTPD_BIN" "$bundle/vhttpd"
          bash ./scripts/bundle_runtime_libs.sh "$bundle/vhttpd" "$bundle/runtime/libs"
          cp ./README.md "$bundle/README.md"
          cp ./scripts/install_runtime.sh "$bundle/scripts/install_runtime.sh"
          cp ./scripts/runtime_doctor.sh "$bundle/scripts/runtime_doctor.sh"
          cp ./scripts/bundle_runtime_libs.sh "$bundle/scripts/bundle_runtime_libs.sh"
          chmod +x "$bundle/scripts/install_runtime.sh" "$bundle/scripts/runtime_doctor.sh" "$bundle/scripts/bundle_runtime_libs.sh"
          tar -czf "$bundle.tar.gz" "$bundle"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vhttpd-${{ matrix.target }}
          path: vhttpd-${{ matrix.target }}.tar.gz
          if-no-files-found: error

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-${{ matrix.target }}-logs
          path: ci-results/
          if-no-files-found: warn
          retention-days: 14

  test-inproc-fast:
    if: github.event_name != 'workflow_dispatch' || inputs.validation != 'nightly'
    name: ${{ matrix.suite }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, macos-15]
        suite: [inproc, codexbot-fast]
    uses: ./.github/workflows/runtime-regression.yml
    with:
      os: ${{ matrix.os }}
      suite: ${{ matrix.suite }}

  # A registered workflow can dispatch the full matrix before the new scheduled
  # workflow is merged into the default branch. Both use the identical callee.
  nightly-acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.validation == 'nightly'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, macos-15]
    uses: ./.github/workflows/runtime-regression.yml
    with:
      os: ${{ matrix.os }}
      suite: all
