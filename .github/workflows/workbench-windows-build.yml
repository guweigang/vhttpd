name: Workbench Windows Build Probe

on:
  workflow_dispatch:
  push:
    branches: ['codex/windows-workbench-*']
    paths: ['desktop/**', 'src/**', 'scripts/**', '.github/workflows/workbench-windows-build.yml']
  pull_request:
    paths: ['desktop/**', 'src/**', 'scripts/**', '.github/workflows/workbench-windows-build.yml']

permissions:
  contents: read

jobs:
  windows-amd64:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve LF for reproducible dependency patches
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      # Same immutable MSVC environment action used by the pinned V source CI.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Prepare pinned native V, QuickJS and build-local ui2
        id: toolchain
        run: |
          $output = "$PWD/desktop/ci/results/windows-build"
          New-Item -ItemType Directory -Force $output | Out-Null
          ./desktop/ci/prepare_windows_toolchain.ps1 2>&1 | Tee-Object "$output/toolchain-build.log"
      - name: Build and launch native ui2 window
        id: ui2
        continue-on-error: true
        run: |
          $output = "$PWD/desktop/ci/results/windows-build"
          $path = "$env:WORKBENCH_WINDOWS_MODULES|@vlib|@vmodules"
          & v -prod -cc msvc -gc boehm -d use_bundled_libgc -w -enable-globals -path $path `
            -o "$output/ui2-windows-probe.exe" desktop/ci/windows_ui_probe.v 2>&1 | Tee-Object "$output/ui2-build.log"
          if ($LASTEXITCODE -ne 0) { throw 'ui2 native build failed' }
          $env:VHTTPD_WINDOWS_PROBE_READY = "$output/native-window-ready.txt"
          $process = Start-Process "$output/ui2-windows-probe.exe" -PassThru -RedirectStandardOutput "$output/ui2-stdout.log" -RedirectStandardError "$output/ui2-stderr.log"
          try {
            $deadline = (Get-Date).AddSeconds(30)
            while (!(Test-Path $env:VHTTPD_WINDOWS_PROBE_READY) -and !$process.HasExited -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 200; $process.Refresh() }
            if (!(Test-Path $env:VHTTPD_WINDOWS_PROBE_READY)) { throw 'Native HWND did not become ready' }
            if (!$process.CloseMainWindow()) { throw 'Native window did not accept close request' }
            if (!$process.WaitForExit(10000)) { throw 'Native window did not exit' }
            if ($process.ExitCode -ne 0) { throw "Native window exited $($process.ExitCode)" }
          } finally { if (!$process.HasExited) { Stop-Process -Id $process.Id -Force } }
      - name: Attempt full Desktop build
        id: desktop
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        continue-on-error: true
        run: |
          $output = "$PWD/desktop/ci/results/windows-build"
          $path = "$PWD/desktop|$PWD/src|$env:WORKBENCH_WINDOWS_MODULES|$env:WORKBENCH_WINDOWS_SDK_PARENT|$PWD/.deps|@vlib|@vmodules"
          & v -prod -cc msvc -gc boehm -d use_bundled_libgc -d link_quickjs -w -enable-globals `
            -path $path -o "$output/vhttpd-workbench.exe" desktop 2>&1 | Tee-Object "$output/desktop-build.log"
          if ($LASTEXITCODE -ne 0) { throw 'Full Desktop is not yet Windows-compatible; see desktop-build.log' }
      - name: Record supported scope and enforce result
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          $result = @{ ui2 = '${{ steps.ui2.outcome }}'; desktop = '${{ steps.desktop.outcome }}';
            scope = 'Build probe only; no Windows vhttpd runtime bundled, SSH password and lifecycle not accepted, no release published';
            commit = '${{ github.sha }}' }
          $result | ConvertTo-Json | Set-Content desktop/ci/results/windows-build/result.json
          if ($result.ui2 -ne 'success' -or $result.desktop -ne 'success') { throw 'Windows is not ready for delivery; diagnostic artifacts retained' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-windows-amd64-build-probe
          path: desktop/ci/results/windows-build/
