name: Workbench Windows Desktop Test Package

on:
  workflow_dispatch:
  push:
    branches: ['codex/windows-workbench-*']
    paths: ['desktop/**', 'src/**', 'scripts/**', '.github/workflows/workbench-windows-build.yml']

permissions:
  contents: read

jobs:
  windows-files:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Check native Windows publication and rollback
        shell: pwsh
        run: |
          & cl /nologo /utf-8 /W4 /std:c11 desktop/ci/windows_files_probe.c /Fe:windows-files-probe.exe /link Advapi32.lib
          if ($LASTEXITCODE -ne 0) { throw 'MSVC native file probe build failed' }
          & ./windows-files-probe.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native file publication probe failed' }
      - name: Compile native GUI askpass helper
        shell: pwsh
        run: |
          & cl /nologo /O2 /W4 /utf-8 /std:c11 desktop/ci/windows_askpass.c /Fe:askpass-compile-probe.exe /link /SUBSYSTEM:WINDOWS Ws2_32.lib Shell32.lib
          if ($LASTEXITCODE -ne 0) { throw 'Native GUI askpass helper compilation failed' }
      - name: Parse portable package scripts
        shell: pwsh
        run: |
          foreach ($file in @('desktop/ci/package_windows.ps1','desktop/ci/verify_windows_package.ps1')) {
            $tokens = $null; $errors = $null
            [Management.Automation.Language.Parser]::ParseFile("$PWD/$file", [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | Format-List; throw "PowerShell parse failed: $file" }
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check actual OpenSSH password helper without V bootstrap
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check paramiko==5.1.0
          if ($LASTEXITCODE -ne 0) { throw 'Fixture dependency setup failed' }
          $pin = Get-Content desktop/ci/windows-openssh.json -Raw | ConvertFrom-Json
          $folder = "$env:RUNNER_TEMP/SSH 用户 native probe"
          New-Item -ItemType Directory -Force $folder | Out-Null
          Invoke-WebRequest $pin.url -OutFile "$folder/ssh.zip"
          if ((Get-FileHash "$folder/ssh.zip" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pin.sha256) { throw 'OpenSSH checksum mismatch' }
          Expand-Archive "$folder/ssh.zip" "$folder/ssh"
          Copy-Item askpass-compile-probe.exe "$folder/askpass.exe"
          python desktop/ci/windows_native_ssh_probe.py "$folder/ssh/OpenSSH-Win64/ssh.exe" "$folder/askpass.exe" "$folder/state"
          if ($LASTEXITCODE -ne 0) { throw 'Real OpenSSH/helper test failed' }
  windows-amd64:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve LF for reproducible dependency patches
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - uses: actions/cache@v4
        with:
          path: .cache/vcpkg-binary-cache
          key: windows-workbench-openssl-msvc-${{ hashFiles('desktop/ci/windows-vcpkg.commit') }}
      - name: Prepare OpenSSL SDK using vjsx MSVC contract
        run: ./desktop/ci/prepare_windows_openssl.ps1
      - name: Prepare pinned native V, QuickJS and build-local ui2
        id: toolchain
        run: |
          $output = "$PWD/desktop/ci/results/windows-build"
          New-Item -ItemType Directory -Force $output | Out-Null
          ./desktop/ci/prepare_windows_toolchain.ps1 2>&1 | Tee-Object "$output/toolchain-build.log"
      - name: Build and launch native ui2 window
        id: ui2
        continue-on-error: true
        run: |
          $output = "$PWD/desktop/ci/results/windows-build"
          $path = "$env:WORKBENCH_WINDOWS_MODULES|@vlib|@vmodules"
          $sdkCompatibility = '/FI"' + "$PWD/desktop/ci/msvc_sdk_compat.h" + '"'
          & v -prod -new-compiler -cc msvc -gc boehm -cflags $sdkCompatibility -w -enable-globals -path $path `
            -o "$output/ui2-windows-probe.exe" desktop/ci/windows_display_probe.v 2>&1 | Tee-Object "$output/ui2-build.log"
          if ($LASTEXITCODE -ne 0) { throw 'ui2 native build failed' }
          $env:VHTTPD_WINDOWS_PROBE_READY = "$output/native-window-ready.txt"
          $process = Start-Process "$output/ui2-windows-probe.exe" -PassThru -RedirectStandardOutput "$output/ui2-stdout.log" -RedirectStandardError "$output/ui2-stderr.log"
          try {
            $deadline = (Get-Date).AddSeconds(30)
            while (!(Test-Path $env:VHTTPD_WINDOWS_PROBE_READY) -and !$process.HasExited -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 200; $process.Refresh() }
            if (!(Test-Path $env:VHTTPD_WINDOWS_PROBE_READY)) { throw 'Native HWND did not become ready' }
            if (!$process.CloseMainWindow()) { throw 'Native window did not accept close request' }
            if (!$process.WaitForExit(10000)) { throw 'Native window did not exit' }
            if ($process.ExitCode -ne 0) { throw "Native window exited $($process.ExitCode)" }
          } finally { if (!$process.HasExited) { Stop-Process -Id $process.Id -Force } }
      - name: Verify Windows storage ownership and project publication
        id: storage
        run: |
          $output = "$PWD/desktop/ci/results/windows-build"
          & v -new-compiler -cc msvc -gc boehm -w -enable-globals -path "$PWD/src|@vlib|@vmodules" -o "$output/storage-probe.exe" desktop/ci/windows_storage_probe.v 2>&1 | Tee-Object "$output/storage-build.log"
          if ($LASTEXITCODE -ne 0) { throw 'Windows storage build failed' }
          $storage = Start-Process "$output/storage-probe.exe" -PassThru -RedirectStandardOutput "$output/storage-check.log" -RedirectStandardError "$output/storage-stderr.log"
          try {
            if (!$storage.WaitForExit(30000)) { throw 'Windows storage checks timed out' }
            if ($storage.ExitCode -ne 0) { throw 'Windows storage checks failed' }
          } finally { if (!$storage.HasExited) { Stop-Process -Id $storage.Id -Force } }
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        with:
          name: workbench-windows-storage-diagnostics
          path: |
            desktop/ci/results/windows-build/storage-*.log
      - name: Build and launch full Desktop
        id: desktop
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        continue-on-error: true
        run: |
          $output = "$PWD/desktop/ci/results/windows-build"
          $path = "$PWD/desktop|$PWD/src|$env:WORKBENCH_WINDOWS_MODULES|$env:WORKBENCH_WINDOWS_SDK_PARENT|$PWD/.deps|@vlib|@vmodules"
          $sdkCompatibility = '/FI"' + "$PWD/desktop/ci/msvc_sdk_compat.h" + '"'
          Push-Location desktop/assets
          try {
            & rc /nologo /fo "$output/workbench.res" workbench.rc
            if ($LASTEXITCODE -ne 0) { throw 'Windows icon resource compilation failed' }
          } finally { Pop-Location }
          $iconResource = '"' + "$output/workbench.res" + '"'
          & v -prod -new-compiler -cc msvc -gc boehm -cflags $sdkCompatibility -ldflags $iconResource -subsystem windows -d link_quickjs -d use_openssl -w -enable-globals `
            -path $path -o "$output/vhttpd-workbench.exe" desktop 2>&1 | Tee-Object "$output/desktop-build.log"
          if ($LASTEXITCODE -ne 0) { throw 'Full Desktop is not yet Windows-compatible; see desktop-build.log' }
          & cl /nologo /O2 /W4 /utf-8 /std:c11 desktop/ci/windows_askpass.c /Fe:"$output/vhttpd-ssh-askpass.exe" /link /SUBSYSTEM:WINDOWS Ws2_32.lib Shell32.lib
          if ($LASTEXITCODE -ne 0) { throw 'Native GUI SSH helper build failed' }

          New-Item -ItemType Directory -Force "$output/resources" | Out-Null
          python desktop/prepare_fonts.py "$output/resources/fonts"
          if ($LASTEXITCODE -ne 0) { throw 'Bundled font staging failed' }
          Copy-Item admin/ui/brand/mark.png "$output/resources/vhttpd-mark.png"
          ./desktop/ci/prepare_windows_brand.ps1 -Source "$PWD/admin/ui/brand/mark.png" -Destination "$output/resources/vhttpd-mark.bmp"
          foreach ($pattern in @('libcrypto-*.dll', 'libssl-*.dll')) {
            $dlls = @(Get-ChildItem "$env:OPENSSL_ROOT_DIR/bin" -Filter $pattern -File)
            if ($dlls.Count -eq 0) { throw "Missing OpenSSL runtime DLL: $pattern" }
            $dlls | Copy-Item -Destination $output
          }
          & dumpbin /DEPENDENTS "$output/vhttpd-workbench.exe" | Set-Content "$output/desktop-dependencies.txt"
          $env:PATH = "$output;$env:WINDIR/System32;$env:WINDIR"

          $env:VHTTPD_DESKTOP_DATA_DIR = "$output/isolated-data"
          $env:VHTTPD_DESKTOP_REGISTRY = "$output/isolated-data/projects.json"
          New-Item -ItemType Directory -Force $env:VHTTPD_DESKTOP_DATA_DIR | Out-Null
          '[{"id":"aaaaaaaaaaaaaaaaaaaaaaaa","name":"CI Menu Host","ssh_host":"127.0.0.1","ssh_user":"fixture","ssh_port":22,"auth_method":"password"}]' | Set-Content "$env:VHTTPD_DESKTOP_DATA_DIR/remote-servers.json" -Encoding utf8
          $env:VHTTPD_DESKTOP_CI_READY = "$output/desktop-window-ready.txt"
          $process = Start-Process "$output/vhttpd-workbench.exe" -WorkingDirectory $output -PassThru -RedirectStandardOutput "$output/desktop-stdout.log" -RedirectStandardError "$output/desktop-stderr.log"
          try {
            $deadline = (Get-Date).AddSeconds(30)
            while (!(Test-Path $env:VHTTPD_DESKTOP_CI_READY) -and !$process.HasExited -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 200; $process.Refresh() }
            if (!(Test-Path $env:VHTTPD_DESKTOP_CI_READY)) { throw 'Full Desktop HWND did not become ready' }
            Start-Sleep -Seconds 2
            $process.Refresh()
            if ($process.HasExited) { throw 'Full Desktop exited before close request' }
            Add-Type -AssemblyName System.Drawing
            Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public class WorkbenchWindow { [StructLayout(LayoutKind.Sequential)] public struct Rect { public int Left, Top, Right, Bottom; } [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hwnd, out Rect rect); }'
            $rect = New-Object WorkbenchWindow+Rect
            if (![WorkbenchWindow]::GetWindowRect($process.MainWindowHandle, [ref]$rect)) { throw 'Full Desktop window bounds unavailable' }
            $bitmap = New-Object Drawing.Bitmap ($rect.Right - $rect.Left), ($rect.Bottom - $rect.Top)
            $graphics = [Drawing.Graphics]::FromImage($bitmap)
            try {
              $graphics.CopyFromScreen($rect.Left, $rect.Top, 0, 0, $bitmap.Size)
              $bitmap.Save("$output/desktop-window.png", [Drawing.Imaging.ImageFormat]::Png)
            } finally { $graphics.Dispose(); $bitmap.Dispose() }

            ./desktop/ci/verify_windows_ui.ps1 -DesktopProcessId $process.Id -OutputDirectory $output
            if (!$process.CloseMainWindow()) { throw 'Full Desktop did not accept close request' }
            if (!$process.WaitForExit(15000)) { throw 'Full Desktop did not exit cleanly' }
            if ($process.ExitCode -ne 0) { throw "Full Desktop exited $($process.ExitCode)" }
          } finally { if (!$process.HasExited) { Stop-Process -Id $process.Id -Force } }

      - name: Create portable Windows test archive
        id: package
        if: ${{ !cancelled() && steps.desktop.outcome == 'success' && steps.storage.outcome == 'success' }}
        run: |
          ./desktop/ci/package_windows.ps1 -Executable "$PWD/desktop/ci/results/windows-build/vhttpd-workbench.exe" 2>&1 | Tee-Object "$PWD/desktop/ci/results/windows-build/package.log"
      - uses: actions/setup-python@v5
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        with:
          python-version: '3.12'
      - name: Prepare loopback-only SSH acceptance fixture
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: python -m pip install --disable-pip-version-check paramiko==5.1.0
      - name: Verify extracted archive without development environment
        id: portable
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          ./desktop/ci/verify_windows_package.ps1 -Archive '${{ steps.package.outputs.archive }}' -ResultDirectory "$PWD/desktop/ci/results/windows-portable"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.portable.outcome == 'success' }}
        with:
          name: vhttpd-workbench-windows-amd64-test
          path: ${{ steps.package.outputs.package_dir }}/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.portable.outcome == 'success' }}
        with:
          name: vhttpd-workbench-windows-amd64-test-archive
          path: |
            desktop/ci/results/windows-package/vhttpd-workbench-*.zip
            desktop/ci/results/windows-package/vhttpd-workbench-*.zip.sha256
          retention-days: 30
      - name: Record supported scope and enforce result
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          $result = @{ compiler = 'MSVC'; ui2 = '${{ steps.ui2.outcome }}'; desktop = '${{ steps.desktop.outcome }}'; storage = '${{ steps.storage.outcome }}'; portable = '${{ steps.portable.outcome }}';
            scope = 'Portable MSVC Desktop test archive; bundled OpenSSL, VC runtime and OpenSSH; extracted startup and password helper checked; real-server Windows acceptance pending; no Windows vhttpd runtime';
            commit = '${{ github.sha }}' }
          $result | ConvertTo-Json | Set-Content desktop/ci/results/windows-build/result.json
          if ($result.ui2 -ne 'success' -or $result.desktop -ne 'success' -or $result.storage -ne 'success' -or $result.portable -ne 'success') { throw 'Windows is not ready for delivery; diagnostic artifacts retained' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-windows-amd64-build-probe
          path: |
            desktop/ci/results/windows-build/
            desktop/ci/results/windows-portable/
