name: Nightly full runtime matrix
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightly-full-${{ github.ref }}
  cancel-in-progress: false
jobs:
  nightly-full:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, macos-15]
    uses: ./.github/workflows/runtime-regression.yml
    with:
      os: ${{ matrix.os }}
      suite: all
